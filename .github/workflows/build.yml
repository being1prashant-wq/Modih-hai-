name: Build ModihMusic APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          APP_GRADLE=$(find extracted -type f -path "*/app/build.gradle.kts" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            echo "Files inside ZIP:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Create/fix settings.gradle.kts
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          SETTINGS="$PROJECT_DIR/settings.gradle.kts"

          echo "Creating Gradle settings..."

          cat > "$SETTINGS" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ModihMusic"

          include(":app")
          EOF

          echo "settings.gradle.kts created:"
          cat "$SETTINGS"

      - name: Show project structure
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "===== PROJECT ====="
          ls -la "$PROJECT_DIR"

          echo ""
          echo "===== APP ====="
          ls -la "$PROJECT_DIR/app"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          mkdir -p apk

          find extracted \
            -type f \
            -name "*.apk" \
            -exec cp {} apk/ \;

          echo "===== APK FILES ====="
          ls -lh apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModihMusic-debug-APK
          path: apk/*.apk
          if-no-files-found: error
