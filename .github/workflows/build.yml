name: Build ModihMusic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted/OfflineMusicNew
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModihMusic-debug-APK
          path: extracted/OfflineMusicNew/app/build/outputs/apk/debug/*.apk
