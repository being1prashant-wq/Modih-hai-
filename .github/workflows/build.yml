name: Build ModihMusic APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Show project files
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo ""
          echo "Files:"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          mkdir apk
          find extracted -type f -name "*.apk" -exec cp {} apk/ \;
          echo "APK files found:"
          ls -lh apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModihMusic-debug-APK
          path: apk/*.apk
          
