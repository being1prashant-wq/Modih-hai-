name: Build ModihMusic APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          echo "Searching for app/build.gradle.kts..."

          APP_GRADLE=$(find extracted -type f -path "*/app/build.gradle.kts" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            echo ""
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Show project files
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "App files:"
          ls -la "$PROJECT_DIR/app"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."

          mkdir -p apk

          find extracted \
            -type f \
            -name "*.apk" \
            -exec cp {} apk/ \;

          echo ""
          echo "APK files found:"
          ls -lh apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModihMusic-debug-APK
          path: apk/*.apk
          if-no-files-found: error
